<body>

<div class="game-container">
  <h1 class="game-title">🍬 CANDY SNAKE 🍭</h1>
  <div class="score-board">
    <div class="score-box">SCORE<br><span id="score">0</span></div>
    <div class="score-box">COMBO<br><span id="combo">x0</span></div>
    <div class="score-box">BEST<br><span id="highScore">0</span></div>
    <button class="sound-btn" id="soundBtn" title="开关音效">🔊</button>
  </div>
  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div class="combo-display" id="comboDisplay"></div>
  </div>
  <div class="controls-hint">
    方向键 / WASD 移动<br>
    空格 开始 / 重开 &nbsp;|&nbsp; P 暂停
  </div>
  <div id="overlay" class="overlay">
    <div class="candy-logo"><span class="s">S</span><span class="n">N</span><span class="a">A</span><span class="k">K</span><span class="e">E</span></div>
    <div class="overlay-title">CANDY SNAKE</div>
    <div class="overlay-score">最高分: <span id="overlayBest">0</span></div>
    <div class="overlay-hint">
      吃水果累积连击<br>
      每 10 连击有惊喜哦 ✨
    </div>
    <button class="pixel-btn" id="startBtn">START 🍬</button>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const highScoreEl = document.getElementById('highScore');
  const comboEl = document.getElementById('combo');
  const comboDisplay = document.getElementById('comboDisplay');
  const canvasWrap = document.getElementById('canvasWrap');
  const overlay = document.getElementById('overlay');
  const overlayBest = document.getElementById('overlayBest');
  const startBtn = document.getElementById('startBtn');

  const GRID = 20;
  const COLS = canvas.width / GRID;
  const ROWS = canvas.height / GRID;

  const COLORS = {
    bgTop: '#fce7f3',
    bgBottom: '#f3e8ff',
    grid: 'rgba(236, 72, 153, 0.15)',
    snakeHead: '#ff6b9d',
    snakeBodyA: '#ff9ec6',
    snakeBodyB: '#d8b4fe',
    snakeCheek: '#fda4af',
    snakeEye: '#fff',
    snakePupil: '#6b2d5c',
    snakeMouth: '#be185d'
  };

  // 水果类型
  const FRUITS = [
    { type: 'grape',    color: '#8b5cf6', points: 1, weight: 50 },
    { type: 'strawberry', color: '#ef4444', points: 2, weight: 30 },
    { type: 'orange',   color: '#f97316', points: 3, weight: 15 },
    { type: 'watermelon', color: '#22c55e', points: 5, weight: 5  }
  ];

  // 彩虹色
  const RAINBOW = ['#ff6b9d', '#f97316', '#facc15', '#22c55e', '#3b82f6', '#8b5cf6', '#ec4899'];

  let snake, direction, nextDirection, food, score, highScore, speed, gameStatus, lastTime, accumulator;
  let combo = 0;
  let touchStartX = 0, touchStartY = 0;
  const SWIPE_THRESHOLD = 30;

  // 背景装饰
  let stars = [];
  let clouds = [];
  let time = 0;

  // 屏幕震动
  let shakeAmount = 0;

  // 初始化背景装饰
  function initDecorations() {
    stars = [];
    for (let i = 0; i < 15; i++) {
      stars.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: 1 + Math.random() * 2,
        phase: Math.random() * Math.PI * 2,
        speed: 0.02 + Math.random() * 0.03
      });
    }
    clouds = [
      { x: 40, y: 30, size: 1 },
      { x: 320, y: 60, size: 0.8 },
      { x: 150, y: 350, size: 1.2 },
      { x: 300, y: 340, size: 0.9 }
    ];
  }

  // 音效系统
  let audioCtx = null;
  let soundEnabled = true;

  function initAudio() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch(e) { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playTone(freq, duration, type, volume, delay) {
    if (!soundEnabled || !audioCtx) return;
    const d = delay || 0;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    const t = audioCtx.currentTime + d;
    gain.gain.setValueAtTime(0, t);
    gain.gain.linearRampToValueAtTime(volume || 0.1, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + duration);
  }

  function playEat(fruitPoints) {
    const baseFreq = 600 + fruitPoints * 100;
    playTone(baseFreq, 0.08, 'square', 0.1);
    playTone(baseFreq * 1.5, 0.1, 'square', 0.08, 0.06);
  }

  function playCombo() {
    playTone(880, 0.06, 'square', 0.08);
    playTone(1100, 0.06, 'square', 0.08, 0.05);
    playTone(1320, 0.08, 'square', 0.07, 0.1);
  }

  function playMilestone(level) {
    const base = 523;
    const notes = [base, base*1.25, base*1.5, base*2, base*2.5];
    for (let i = 0; i < Math.min(notes.length, 3 + level); i++) {
      playTone(notes[i], 0.12, 'square', 0.1, i * 0.08);
      playTone(notes[i] * 2, 0.08, 'triangle', 0.06, i * 0.08 + 0.02);
    }
  }

  function playGameOver() {
    playTone(440, 0.15, 'square', 0.12);
    playTone(330, 0.15, 'square', 0.1, 0.12);
    playTone(220, 0.3, 'square', 0.08, 0.24);
  }

  function playStart() {
    playTone(523, 0.08, 'square', 0.08);
    playTone(659, 0.08, 'square', 0.08, 0.08);
    playTone(784, 0.12, 'square', 0.1, 0.16);
  }

  function toggleSound() {
    soundEnabled = !soundEnabled;
    const btn = document.getElementById('soundBtn');
    if (btn) btn.textContent = soundEnabled ? '🔊' : '🔇';
  }

  // 粒子系统
  let particles = [];
  let shockwaves = [];
  let floatingTexts = [];

  function spawnParticles(gridX, gridY, color, count, options) {
    const cx = gridX * GRID + GRID / 2;
    const cy = gridY * GRID + GRID / 2;
    const opts = options || {};
    const speedMul = opts.speedMul || 1;
    const sizeMul = opts.sizeMul || 1;
    const secondColor = opts.secondColor || color;
    const rainbow = opts.rainbow || false;

    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = (1.5 + Math.random() * 4.5) * speedMul;
      let pColor = color;
      if (rainbow) {
        pColor = RAINBOW[Math.floor(Math.random() * RAINBOW.length)];
      } else if (Math.random() < 0.4) {
        pColor = secondColor;
      }
      particles.push({
        x: cx,
        y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        baseSize: (2 + Math.random() * 5) * sizeMul,
        size: 0,
        color: pColor,
        life: 1,
        maxLife: 0.8 + Math.random() * 0.6,
        decay: 0.012 + Math.random() * 0.015,
        gravity: 0.08 + Math.random() * 0.1,
        glow: Math.random() < 0.4,
        phase: Math.random() * Math.PI * 2,
        isStar: rainbow && Math.random() < 0.2
      });
    }
  }

  function spawnShockwave(gridX, gridY, color, options) {
    const cx = gridX * GRID + GRID / 2;
    const cy = gridY * GRID + GRID / 2;
    const opts = options || {};
    shockwaves.push({
      x: cx,
      y: cy,
      radius: 2,
      maxRadius: (opts.sizeMul || 1) * GRID * 2.5,
      color: color,
      life: 1,
      rainbow: opts.rainbow || false,
      lineWidth: opts.lineWidth || 3
    });
  }

  function spawnFloatingText(gridX, gridY, text, color) {
    floatingTexts.push({
      x: gridX * GRID + GRID / 2,
      y: gridY * GRID + GRID / 2,
      text: text,
      color: color || '#ff6b9d',
      life: 1,
      vy: -1.5
    });
  }

  function triggerShake(amount) {
    shakeAmount = amount;
    canvasWrap.classList.remove('shake');
    void canvasWrap.offsetWidth;
    canvasWrap.classList.add('shake');
    setTimeout(() => { shakeAmount = 0; }, 300);
  }

  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += p.gravity;
      p.vx *= 0.98;
      p.life -= p.decay;
      p.phase += 0.2;
      const lifeRatio = p.life / p.maxLife;
      const grow = Math.min(1, lifeRatio * 3);
      const shrink = Math.max(0, (lifeRatio - 0.3) / 0.7);
      p.size = p.baseSize * grow * shrink * (1 + 0.2 * Math.sin(p.phase));
      if (p.life <= 0) particles.splice(i, 1);
    }

    for (let i = shockwaves.length - 1; i >= 0; i--) {
      const s = shockwaves[i];
      s.radius += (s.maxRadius - s.radius) * 0.15;
      s.life -= 0.04;
      if (s.life <= 0) shockwaves.splice(i, 1);
    }

    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      const t = floatingTexts[i];
      t.y += t.vy;
      t.life -= 0.02;
      if (t.life <= 0) floatingTexts.splice(i, 1);
    }
  }

  function drawParticles() {
    // 冲击环
    shockwaves.forEach(s => {
      if (s.rainbow) {
        for (let r = 0; r < RAINBOW.length; r++) {
          ctx.globalAlpha = s.life * 0.5;
          ctx.strokeStyle = RAINBOW[r];
          ctx.lineWidth = s.lineWidth;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.radius * (1 - r * 0.08), 0, Math.PI * 2);
          ctx.stroke();
        }
      } else {
        ctx.globalAlpha = s.life * 0.6;
        ctx.strokeStyle = s.color;
        ctx.lineWidth = s.lineWidth || 3;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = s.life * 0.3;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.radius * 0.7, 0, Math.PI * 2);
        ctx.stroke();
      }
    });

    // 发光层
    particles.forEach(p => {
      if (p.glow && p.size > 1) {
        ctx.globalAlpha = Math.max(0, p.life) * 0.4;
        ctx.fillStyle = p.color;
        const gs = p.size * 2.5;
        ctx.fillRect(Math.floor(p.x - gs/2), Math.floor(p.y - gs/2), Math.floor(gs), Math.floor(gs));
      }
    });

    // 正常粒子
    particles.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      const s = Math.max(1, Math.floor(p.size));
      if (p.isStar) {
        // 画十字星
        ctx.fillRect(Math.floor(p.x - s/2), Math.floor(p.y - s*0.1), s, Math.max(1, Math.floor(s*0.2)));
        ctx.fillRect(Math.floor(p.x - s*0.1), Math.floor(p.y - s/2), Math.max(1, Math.floor(s*0.2)), s);
      } else {
        ctx.fillRect(Math.floor(p.x - s/2), Math.floor(p.y - s/2), s, s);
      }
    });

    // 飘字
    floatingTexts.forEach(t => {
      ctx.globalAlpha = Math.max(0, t.life);
      ctx.fillStyle = t.color;
      ctx.font = 'bold 14px "Press Start 2P", monospace';
      ctx.textAlign = 'center';
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3;
      ctx.strokeText(t.text, t.x, t.y);
      ctx.fillText(t.text, t.x, t.y);
    });

    ctx.globalAlpha = 1;
    ctx.textAlign = 'left';
  }

  function init() {
    highScore = loadHighScore();
    highScoreEl.textContent = highScore;
    overlayBest.textContent = highScore;
    initDecorations();
    resetGame();
    draw();
    bindEvents();
    requestAnimationFrame(gameLoop);
  }

  function resetGame() {
    snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
    direction = {x: 1, y: 0};
    nextDirection = {x: 1, y: 0};
    food = {x: 15, y: 10, type: 'strawberry', color: '#ef4444', points: 2};
    score = 0;
    combo = 0;
    speed = 150;
    accumulator = 0;
    particles = [];
    shockwaves = [];
    floatingTexts = [];
    shakeAmount = 0;
    gameStatus = 'start';
    spawnFood();
    updateScore();
    updateComboDisplay();
  }

  function loadHighScore() {
    try {
      const saved = localStorage.getItem('candySnakeHighScore');
      return saved ? parseInt(saved, 10) : 0;
    } catch(e) { return 0; }
  }

  function saveHighScore() {
    if (score > highScore) {
      highScore = score;
      highScoreEl.textContent = highScore;
      try { localStorage.setItem('candySnakeHighScore', score.toString()); } catch(e) {}
    }
  }

  function pickFruit() {
    const total = FRUITS.reduce((s, f) => s + f.weight, 0);
    let rand = Math.random() * total;
    for (const f of FRUITS) {
      rand -= f.weight;
      if (rand <= 0) return { ...f };
    }
    return { ...FRUITS[0] };
  }

  function spawnFood() {
    let valid = false;
    let newFood;
    while (!valid) {
      const fruit = pickFruit();
      newFood = {
        x: Math.floor(Math.random() * COLS),
        y: Math.floor(Math.random() * ROWS),
        type: fruit.type,
        color: fruit.color,
        points: fruit.points
      };
      valid = !snake.some(s => s.x === newFood.x && s.y === newFood.y);
    }
    food = newFood;
  }

  function updateScore() {
    scoreEl.textContent = score;
  }

  function updateComboDisplay() {
    comboEl.textContent = 'x' + combo;
    comboEl.style.color = combo >= 10 ? '#f97316' : (combo >= 5 ? '#ec4899' : '#a855f7');
  }

  function showComboPopup(text) {
    comboDisplay.textContent = text;
    comboDisplay.classList.remove('show');
    void comboDisplay.offsetWidth;
    comboDisplay.classList.add('show');
  }

  function getComboMultiplier() {
    if (combo >= 5) return 2;
    if (combo >= 2) return 1.5;
    return 1;
  }

  function setDirection(dx, dy) {
    if (gameStatus !== 'playing') return;
    if (dx === -direction.x && dy === -direction.y) return;
    nextDirection = {x: dx, y: dy};
  }

  function update() {
    direction = nextDirection;
    const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};

    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      gameOver();
      return;
    }

    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      gameOver();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      combo++;
      const mult = getComboMultiplier();
      const points = Math.floor(food.points * mult);
      score += points;
      updateScore();
      updateComboDisplay();

      // 吃食物粒子
      spawnParticles(food.x, food.y, food.color, 20, {
        speedMul: 1.3,
        sizeMul: 1.2,
        secondColor: '#ffd93d'
      });
      spawnShockwave(food.x, food.y, food.color);

      // 飘分
      spawnFloatingText(food.x, food.y, '+' + points, food.color);

      // 连击特效
      if (combo > 1) {
        playCombo();
        if (combo % 10 === 0) {
          // 里程碑！
          const level = Math.floor(combo / 10);
          playMilestone(level);
          triggerShake(3 + level);
          spawnParticles(food.x, food.y, '#ff6b9d', 40 + level * 10, {
            speedMul: 1.5 + level * 0.2,
            sizeMul: 1.5,
            rainbow: true
          });
          spawnShockwave(food.x, food.y, '#ff6b9d', {
            sizeMul: 2 + level * 0.5,
            rainbow: true,
            lineWidth: 4
          });
          showComboPopup('🌟 x' + combo + ' COMBO! 🌟');
        } else {
          showComboPopup('x' + combo + ' COMBO!');
        }
      } else {
        playEat(food.points);
      }

      spawnFood();
    } else {
      snake.pop();
    }
  }

  // 绘制背景
  function drawBackground() {
    // 渐变底色
    const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grad.addColorStop(0, COLORS.bgTop);
    grad.addColorStop(1, COLORS.bgBottom);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 云朵（像素对齐，避免抖动）
    ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
    clouds.forEach(c => {
      const cx = Math.floor(c.x + Math.sin(time * 0.008 + c.x * 0.1) * 4);
      const cy = Math.floor(c.y);
      const s = c.size;
      ctx.fillRect(cx, cy, Math.floor(24 * s), Math.floor(8 * s));
      ctx.fillRect(cx + Math.floor(4 * s), cy - Math.floor(4 * s), Math.floor(16 * s), Math.floor(4 * s));
      ctx.fillRect(cx + Math.floor(8 * s), cy - Math.floor(6 * s), Math.floor(8 * s), Math.floor(2 * s));
    });

    // 星星闪烁
    stars.forEach(st => {
      const twinkle = 0.5 + 0.5 * Math.sin(time * st.speed + st.phase);
      ctx.globalAlpha = twinkle * 0.8;
      ctx.fillStyle = '#fff';
      const s = st.size;
      ctx.fillRect(Math.floor(st.x - s/2), Math.floor(st.y), s, 1);
      ctx.fillRect(Math.floor(st.x), Math.floor(st.y - s/2), 1, s);
      ctx.globalAlpha = 1;
    });

    // 网格
    ctx.strokeStyle = COLORS.grid;
    ctx.lineWidth = 1;
    for (let i = 0; i <= COLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * GRID + 0.5, 0);
      ctx.lineTo(i * GRID + 0.5, canvas.height);
      ctx.stroke();
    }
    for (let i = 0; i <= ROWS; i++) {
      ctx.beginPath();
      ctx.moveTo(0, i * GRID + 0.5);
      ctx.lineTo(canvas.width, i * GRID + 0.5);
      ctx.stroke();
    }
  }

  // 绘制水果 - 像素风格
  function drawFood() {
    const fx = food.x * GRID;
    const fy = food.y * GRID;
    const y = fy;

    // 像素光晕（十字星）
    const glowAlpha = 0.25 + 0.1 * Math.sin(time * 0.08);
    ctx.globalAlpha = glowAlpha;
    ctx.fillStyle = food.color;
    ctx.fillRect(fx + GRID/2 - 1, y + 2, 2, GRID - 4);
    ctx.fillRect(fx + 2, y + GRID/2 - 1, GRID - 4, 2);
    ctx.fillRect(fx + GRID/2 - 2, y + 4, 4, GRID - 8);
    ctx.fillRect(fx + 4, y + GRID/2 - 2, GRID - 8, 4);
    ctx.globalAlpha = 1;

    if (food.type === 'strawberry') {
      // 草莓 - 像素风
      // 底部深色阴影
      ctx.fillStyle = '#991b1b';
      ctx.fillRect(fx + 4, y + 15, 12, 2);
      ctx.fillRect(fx + 6, y + 17, 8, 1);
      // 主体红色
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(fx + 5, y + 6, 10, 9);
      ctx.fillRect(fx + 3, y + 8, 2, 7);
      ctx.fillRect(fx + 15, y + 8, 2, 7);
      ctx.fillRect(fx + 4, y + 7, 12, 1);
      ctx.fillRect(fx + 4, y + 15, 12, 1);
      // 顶部收窄
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(fx + 7, y + 4, 6, 2);
      ctx.fillRect(fx + 8, y + 3, 4, 1);
      // 亮面（左上）
      ctx.fillStyle = '#fca5a5';
      ctx.fillRect(fx + 5, y + 7, 2, 4);
      ctx.fillRect(fx + 6, y + 6, 1, 1);
      // 籽（像素点）
      ctx.fillStyle = '#fef08a';
      ctx.fillRect(fx + 7, y + 9, 1, 1);
      ctx.fillRect(fx + 11, y + 10, 1, 1);
      ctx.fillRect(fx + 9, y + 12, 1, 1);
      ctx.fillRect(fx + 13, y + 13, 1, 1);
      ctx.fillRect(fx + 6, y + 12, 1, 1);
      // 萼片（绿色叶子）
      ctx.fillStyle = '#16a34a';
      ctx.fillRect(fx + 9, y + 1, 2, 3);
      ctx.fillRect(fx + 6, y + 2, 2, 2);
      ctx.fillRect(fx + 12, y + 2, 2, 2);
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(fx + 9, y + 2, 2, 2);
      ctx.fillRect(fx + 7, y + 3, 1, 1);
      ctx.fillRect(fx + 12, y + 3, 1, 1);

    } else if (food.type === 'orange') {
      // 橘子 - 像素风
      // 底部阴影
      ctx.fillStyle = '#9a3412';
      ctx.fillRect(fx + 5, y + 15, 10, 2);
      ctx.fillRect(fx + 7, y + 17, 6, 1);
      // 主体橙色
      ctx.fillStyle = '#f97316';
      ctx.fillRect(fx + 4, y + 6, 12, 9);
      ctx.fillRect(fx + 3, y + 8, 14, 6);
      ctx.fillRect(fx + 5, y + 5, 10, 1);
      ctx.fillRect(fx + 5, y + 15, 10, 1);
      // 顶部
      ctx.fillRect(fx + 7, y + 4, 6, 1);
      ctx.fillRect(fx + 8, y + 3, 4, 1);
      // 亮面
      ctx.fillStyle = '#fdba74';
      ctx.fillRect(fx + 5, y + 7, 3, 3);
      ctx.fillRect(fx + 6, y + 6, 2, 1);
      // 橘子皮纹理
      ctx.fillStyle = '#ea580c';
      ctx.fillRect(fx + 11, y + 8, 1, 1);
      ctx.fillRect(fx + 13, y + 11, 1, 1);
      ctx.fillRect(fx + 8, y + 12, 1, 1);
      ctx.fillRect(fx + 10, y + 14, 1, 1);
      // 叶子
      ctx.fillStyle = '#16a34a';
      ctx.fillRect(fx + 9, y + 1, 2, 3);
      ctx.fillRect(fx + 7, y + 2, 2, 2);
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(fx + 9, y + 2, 2, 2);
      ctx.fillRect(fx + 8, y + 3, 1, 1);

    } else if (food.type === 'grape') {
      // 葡萄 - 像素风（一串7颗）
      const grapeColor = '#7c3aed';
      const grapeShadow = '#5b21b6';
      const grapeLight = '#a78bfa';

      // 先画阴影层
      ctx.fillStyle = grapeShadow;
      // 第一行（顶部2颗）
      ctx.fillRect(fx + 6, y + 6, 4, 1);
      ctx.fillRect(fx + 10, y + 6, 4, 1);
      // 第二行（3颗）
      ctx.fillRect(fx + 3, y + 10, 4, 1);
      ctx.fillRect(fx + 8, y + 10, 4, 1);
      ctx.fillRect(fx + 13, y + 10, 4, 1);
      // 第三行（2颗）
      ctx.fillRect(fx + 6, y + 14, 4, 1);
      ctx.fillRect(fx + 10, y + 14, 4, 1);

      // 主体紫色
      ctx.fillStyle = grapeColor;
      // 第一行（顶部2颗）
      ctx.fillRect(fx + 5, y + 3, 5, 4);
      ctx.fillRect(fx + 4, y + 4, 7, 2);
      ctx.fillRect(fx + 11, y + 3, 5, 4);
      ctx.fillRect(fx + 10, y + 4, 7, 2);
      // 第二行（3颗）
      ctx.fillRect(fx + 2, y + 7, 5, 4);
      ctx.fillRect(fx + 1, y + 8, 7, 2);
      ctx.fillRect(fx + 8, y + 7, 5, 4);
      ctx.fillRect(fx + 7, y + 8, 7, 2);
      ctx.fillRect(fx + 14, y + 7, 5, 4);
      ctx.fillRect(fx + 13, y + 8, 7, 2);
      // 第三行（2颗）
      ctx.fillRect(fx + 5, y + 11, 5, 4);
      ctx.fillRect(fx + 4, y + 12, 7, 2);
      ctx.fillRect(fx + 11, y + 11, 5, 4);
      ctx.fillRect(fx + 10, y + 12, 7, 2);

      // 高光
      ctx.fillStyle = grapeLight;
      ctx.fillRect(fx + 6, y + 4, 2, 2);
      ctx.fillRect(fx + 12, y + 4, 2, 2);
      ctx.fillRect(fx + 3, y + 8, 1, 1);
      ctx.fillRect(fx + 9, y + 8, 2, 2);
      ctx.fillRect(fx + 15, y + 8, 1, 1);

      // 葡萄梗
      ctx.fillStyle = '#78350f';
      ctx.fillRect(fx + 9, y + 1, 2, 3);
      ctx.fillStyle = '#92400e';
      ctx.fillRect(fx + 9, y + 1, 1, 2);

    } else if (food.type === 'watermelon') {
      // 西瓜片 - 像素风
      // 绿皮（深色外沿）
      ctx.fillStyle = '#166534';
      ctx.fillRect(fx + 1, y + 13, 18, 3);
      ctx.fillRect(fx + 2, y + 12, 16, 1);
      // 绿皮
      ctx.fillStyle = '#22c55e';
      ctx.fillRect(fx + 2, y + 13, 16, 2);
      // 白瓤
      ctx.fillStyle = '#f0fdf4';
      ctx.fillRect(fx + 2, y + 12, 16, 1);
      // 红瓤主体
      ctx.fillStyle = '#dc2626';
      ctx.fillRect(fx + 2, y + 5, 16, 7);
      // 红瓤底部渐变深
      ctx.fillStyle = '#b91c1c';
      ctx.fillRect(fx + 2, y + 10, 16, 2);
      // 红瓤顶部弧形
      ctx.fillStyle = '#dc2626';
      ctx.fillRect(fx + 4, y + 4, 12, 1);
      ctx.fillRect(fx + 6, y + 3, 8, 1);
      // 亮面
      ctx.fillStyle = '#fca5a5';
      ctx.fillRect(fx + 3, y + 5, 2, 3);
      ctx.fillRect(fx + 4, y + 6, 1, 2);
      // 西瓜籽（黑色像素点）
      ctx.fillStyle = '#000';
      ctx.fillRect(fx + 6, y + 8, 1, 2);
      ctx.fillRect(fx + 5, y + 9, 1, 1);
      ctx.fillRect(fx + 12, y + 7, 1, 2);
      ctx.fillRect(fx + 13, y + 8, 1, 1);
      ctx.fillRect(fx + 9, y + 10, 1, 2);
      ctx.fillRect(fx + 15, y + 9, 1, 1);
    }
  }

  // 绘制蛇
  function drawSnake() {
    snake.forEach((seg, i) => {
      const x = seg.x * GRID;
      const y = seg.y * GRID;

      // 身体交替粉紫
      const bodyColor = i % 2 === 0 ? COLORS.snakeBodyA : COLORS.snakeBodyB;
      ctx.fillStyle = i === 0 ? COLORS.snakeHead : bodyColor;

      // 圆角像素身体
      ctx.fillRect(x + 2, y + 1, GRID - 4, GRID - 2);
      ctx.fillRect(x + 1, y + 2, GRID - 2, GRID - 4);

      // 糖衣高光
      ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.fillRect(x + 3, y + 3, 3, 2);

      if (i === 0) {
        // 腮红
        ctx.fillStyle = COLORS.snakeCheek;
        if (direction.x === 1) {
          ctx.fillRect(x + 13, y + 12, 4, 3);
        } else if (direction.x === -1) {
          ctx.fillRect(x + 3, y + 12, 4, 3);
        } else if (direction.y === -1) {
          ctx.fillRect(x + 3, y + 13, 4, 3);
          ctx.fillRect(x + 13, y + 13, 4, 3);
        } else {
          ctx.fillRect(x + 3, y + 11, 4, 3);
          ctx.fillRect(x + 13, y + 11, 4, 3);
        }

        // 眼睛（白色大眼）
        ctx.fillStyle = COLORS.snakeEye;
        const eyeW = 5, eyeH = 5;
        let ex1, ey1, ex2, ey2;
        if (direction.x === 1) {
          ex1 = x + 11; ey1 = y + 4;
          ex2 = x + 11; ey2 = y + 11;
        } else if (direction.x === -1) {
          ex1 = x + 4; ey1 = y + 4;
          ex2 = x + 4; ey2 = y + 11;
        } else if (direction.y === -1) {
          ex1 = x + 4; ey1 = y + 3;
          ex2 = x + 11; ey2 = y + 3;
        } else {
          ex1 = x + 4; ey1 = y + 12;
          ex2 = x + 11; ey2 = y + 12;
        }
        ctx.fillRect(ex1, ey1, eyeW, eyeH);
        ctx.fillRect(ex2, ey2, eyeW, eyeH);

        // 瞳孔
        ctx.fillStyle = COLORS.snakePupil;
        const pw = 2, ph = 2;
        if (direction.x === 1) {
          ctx.fillRect(ex1 + 2, ey1 + 2, pw, ph);
          ctx.fillRect(ex2 + 2, ey2 + 2, pw, ph);
        } else if (direction.x === -1) {
          ctx.fillRect(ex1 + 1, ey1 + 2, pw, ph);
          ctx.fillRect(ex2 + 1, ey2 + 2, pw, ph);
        } else if (direction.y === -1) {
          ctx.fillRect(ex1 + 2, ey1 + 1, pw, ph);
          ctx.fillRect(ex2 + 2, ey2 + 1, pw, ph);
        } else {
          ctx.fillRect(ex1 + 2, ey1 + 2, pw, ph);
          ctx.fillRect(ex2 + 2, ey2 + 2, pw, ph);
        }

        // 小嘴巴
        ctx.fillStyle = COLORS.snakeMouth;
        if (direction.x === 1) {
          ctx.fillRect(x + 16, y + 8, 2, 3);
        } else if (direction.x === -1) {
          ctx.fillRect(x + 2, y + 8, 2, 3);
        } else if (direction.y === -1) {
          ctx.fillRect(x + 8, y + 2, 3, 2);
        } else {
          ctx.fillRect(x + 8, y + 16, 3, 2);
        }
      }
    });
  }

  function draw() {
    drawBackground();
    drawFood();
    drawSnake();
    drawParticles();
  }

  function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const delta = timestamp - lastTime;
    lastTime = timestamp;
    time += delta;

    if (gameStatus === 'playing') {
      accumulator += delta;
      while (accumulator >= speed) {
        update();
        accumulator -= speed;
        if (gameStatus !== 'playing') break;
      }
    }

    updateParticles();
    draw();
    requestAnimationFrame(gameLoop);
  }

  function startGame() {
    initAudio();
    resetGame();
    gameStatus = 'playing';
    accumulator = 0;
    lastTime = 0;
    overlay.classList.add('hidden');
    playStart();
  }

  function pauseGame() {
    if (gameStatus !== 'playing') return;
    gameStatus = 'paused';
    showOverlay('PAUSED', '按 P 继续', '');
  }

  function resumeGame() {
    if (gameStatus !== 'paused') return;
    gameStatus = 'playing';
    accumulator = 0;
    lastTime = 0;
    overlay.classList.add('hidden');
  }

  function gameOver() {
    gameStatus = 'gameover';
    saveHighScore();
    playGameOver();
    // 蛇身碎裂
    snake.forEach((seg, i) => {
      setTimeout(() => {
        const color = i === 0 ? COLORS.snakeHead : (i % 2 === 0 ? COLORS.snakeBodyA : COLORS.snakeBodyB);
        spawnParticles(seg.x, seg.y, color, 10, {
          speedMul: 1.5,
          sizeMul: 1.3,
          secondColor: '#ffd93d'
        });
        spawnShockwave(seg.x, seg.y, color);
      }, i * 25);
    });
    const isNewRecord = score === highScore && score > 0;
    setTimeout(() => {
      showOverlay(
        'GAME OVER',
        '得分: ' + score,
        isNewRecord ? '✨ NEW RECORD! ✨' : ''
      );
    }, 800);
  }

  function showOverlay(title, scoreText, highlight) {
    overlay.classList.remove('hidden');
    overlay.innerHTML = `
      <div class="candy-logo"><span class="s">S</span><span class="n">N</span><span class="a">A</span><span class="k">K</span><span class="e">E</span></div>
       <div class="overlay-title">${title}</div>
       <div class="overlay-score">${scoreText}</div>
      ${highlight ? `<div class="overlay-highlight">${highlight}</div>` : ''}
      <div class="overlay-hint">
        按 空格 重新开始<br>
        或 点击屏幕
      </div>
      <button class="pixel-btn" id="restartBtn">RESTART 🍬</button>
    `;
    document.getElementById('restartBtn').addEventListener('click', (e) => {
      startGame();
      e.target.blur();
    });
  }

  function bindEvents() {
    document.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();

      if (key === 'arrowup' || key === 'w') { setDirection(0, -1); e.preventDefault(); }
      else if (key === 'arrowdown' || key === 's') { setDirection(0, 1); e.preventDefault(); }
      else if (key === 'arrowleft' || key === 'a') { setDirection(-1, 0); e.preventDefault(); }
      else if (key === 'arrowright' || key === 'd') { setDirection(1, 0); e.preventDefault(); }
      else if (key === ' ' || key === 'enter') {
        e.preventDefault();
        if (gameStatus === 'start' || gameStatus === 'gameover') startGame();
      }
      else if (key === 'p' || key === 'escape') {
        e.preventDefault();
        if (gameStatus === 'playing') pauseGame();
        else if (gameStatus === 'paused') resumeGame();
      }
    });

    startBtn.addEventListener('click', (e) => {
      startGame();
      e.target.blur();
    });

    document.getElementById('soundBtn').addEventListener('click', (e) => {
      initAudio();
      toggleSound();
      e.target.blur();
    });

    canvas.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      e.preventDefault();
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;

      if (Math.abs(dx) < SWIPE_THRESHOLD && Math.abs(dy) < SWIPE_THRESHOLD) {
        if (gameStatus === 'start' || gameStatus === 'gameover') startGame();
        e.preventDefault();
        return;
      }

      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 0) setDirection(1, 0);
        else setDirection(-1, 0);
      } else {
        if (dy > 0) setDirection(0, 1);
        else setDirection(0, -1);
      }
      e.preventDefault();
    }, { passive: false });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden && gameStatus === 'playing') pauseGame();
    });
  }

  init();
})();
</script>

</body>
