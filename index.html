<!DOCTYPE html>

<title>Pixel Snake - 像素贪吃蛇</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0f380f;
    color: #9bbc0f;
    font-family: 'Press Start 2P', 'Courier New', monospace;
    min-height: 100vh;
    display: flex;

    cursor: pointer;
    box-shadow:
      4px 4px 0 0 #0f380f,

  .pixel-btn:active {

  @keyframes blink {

  @media (max-width: 480px) {

<body>

<div class="game-container">
  <h1 class="game-title">PIXEL SNAKE</h1>
  <div class="score-board">
    <span>SCORE: <span id="score">0</span></span>
    <span>BEST: <span id="highScore">0</span></span>
    <button class="sound-btn" id="soundBtn" title="开关音效">🔊</button>
  </div>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <div class="controls-hint">
    方向键 / WASD 移动<br>
    空格 开始 / 重开 &nbsp;|&nbsp; P 暂停
  </div>
  <div id="overlay" class="overlay">
    <div class="overlay-title">PIXEL SNAKE</div>
    <div class="overlay-score">最高分: <span id="overlayBest">0</span></div>
    <div class="overlay-hint">
      按 空格 开始游戏<br>
      或 点击屏幕
    </div>
    <button class="pixel-btn" id="startBtn">START</button>
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const highScoreEl = document.getElementById('highScore');
  const overlay = document.getElementById('overlay');
  const overlayBest = document.getElementById('overlayBest');
  const startBtn = document.getElementById('startBtn');

  const GRID = 20;
  const COLS = canvas.width / GRID;
  const ROWS = canvas.height / GRID;

  const COLORS = {
    bg: '#0f380f',
    grid: '#306230',
    snakeHead: '#9bbc0f',
    snakeBody: '#8bac0f',
    snakeEye: '#0f380f',
    food: '#e63946',
    foodLeaf: '#9bbc0f'
  };

  let snake, direction, nextDirection, food, score, highScore, speed, gameStatus, lastTime, accumulator;
  let touchStartX = 0, touchStartY = 0;
  const SWIPE_THRESHOLD = 30;

  // 音效系统
  let audioCtx = null;
  let soundEnabled = true;

  function initAudio() {
    if (!audioCtx) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      } catch(e) { audioCtx = null; }
    }
    if (audioCtx && audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playTone(freq, duration, type, volume) {
    if (!soundEnabled || !audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type || 'square';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(volume || 0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }

  function playEat() {
    playTone(880, 0.08, 'square', 0.1);
    setTimeout(() => playTone(1320, 0.1, 'square', 0.08), 60);
  }

  function playGameOver() {
    playTone(440, 0.15, 'square', 0.12);
    setTimeout(() => playTone(330, 0.15, 'square', 0.1), 120);
    setTimeout(() => playTone(220, 0.3, 'square', 0.08), 240);
  }

  function playStart() {
    playTone(523, 0.08, 'square', 0.08);
    setTimeout(() => playTone(659, 0.08, 'square', 0.08), 80);
    setTimeout(() => playTone(784, 0.12, 'square', 0.1), 160);
  }

  function toggleSound() {
    soundEnabled = !soundEnabled;
    const btn = document.getElementById('soundBtn');
    if (btn) btn.textContent = soundEnabled ? '🔊' : '🔇';
  }

  // 粒子系统
  let particles = [];
  let shockwaves = [];

  function spawnParticles(gridX, gridY, color, count, options) {
    const cx = gridX * GRID + GRID / 2;
    const cy = gridY * GRID + GRID / 2;
    const opts = options || {};
    const speedMul = opts.speedMul || 1;
    const sizeMul = opts.sizeMul || 1;
    const secondColor = opts.secondColor || color;

    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = (1.5 + Math.random() * 4.5) * speedMul;
      const isSecond = Math.random() < 0.4;
      particles.push({
        x: cx,
        y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        baseSize: (2 + Math.random() * 5) * sizeMul,
        size: 0,
        color: isSecond ? secondColor : color,
        life: 1,
        maxLife: 0.8 + Math.random() * 0.6,
        decay: 0.012 + Math.random() * 0.015,
        gravity: 0.08 + Math.random() * 0.1,
        glow: Math.random() < 0.3,
        phase: Math.random() * Math.PI * 2
      });
    }
  }

  function spawnShockwave(gridX, gridY, color) {
    const cx = gridX * GRID + GRID / 2;
    const cy = gridY * GRID + GRID / 2;
    shockwaves.push({
      x: cx,
      y: cy,
      radius: 2,
      maxRadius: GRID * 2.5,
      color: color,
      life: 1
    });
  }

  function updateParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += p.gravity;
      p.vx *= 0.98;
      p.life -= p.decay;
      p.phase += 0.2;
      // 大小呼吸效果
      const lifeRatio = p.life / p.maxLife;
      const grow = Math.min(1, lifeRatio * 3);
      const shrink = Math.max(0, (lifeRatio - 0.3) / 0.7);
      p.size = p.baseSize * grow * shrink * (1 + 0.2 * Math.sin(p.phase));
      if (p.life <= 0) particles.splice(i, 1);
    }

    for (let i = shockwaves.length - 1; i >= 0; i--) {
      const s = shockwaves[i];
      s.radius += (s.maxRadius - s.radius) * 0.15;
      s.life -= 0.04;
      if (s.life <= 0) shockwaves.splice(i, 1);
    }
  }

  function drawParticles() {
    // 绘制冲击环
    shockwaves.forEach(s => {
      ctx.globalAlpha = s.life * 0.6;
      ctx.strokeStyle = s.color;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
      ctx.stroke();
      // 内层亮环
      ctx.globalAlpha = s.life * 0.3;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.radius * 0.7, 0, Math.PI * 2);
      ctx.stroke();
    });

    // 绘制粒子（发光的先画一层模糊）
    particles.forEach(p => {
      if (p.glow && p.size > 1) {
        ctx.globalAlpha = Math.max(0, p.life) * 0.4;
        ctx.fillStyle = p.color;
        const gs = p.size * 2.5;
        ctx.fillRect(
          Math.floor(p.x - gs / 2),
          Math.floor(p.y - gs / 2),
          Math.floor(gs),
          Math.floor(gs)
        );
      }
    });

    // 正常粒子
    particles.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.fillRect(
        Math.floor(p.x - p.size / 2),
        Math.floor(p.y - p.size / 2),
        Math.max(1, Math.floor(p.size)),
        Math.max(1, Math.floor(p.size))
      );
    });

    ctx.globalAlpha = 1;
  }

  function init() {
    highScore = loadHighScore();
    highScoreEl.textContent = highScore;
    overlayBest.textContent = highScore;
    resetGame();
    draw();
    bindEvents();
    requestAnimationFrame(gameLoop);
  }

  function resetGame() {
    snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
    direction = {x: 1, y: 0};
    nextDirection = {x: 1, y: 0};
    food = {x: 15, y: 10};
    score = 0;
    speed = 150;
    accumulator = 0;
    particles = [];
    shockwaves = [];
    gameStatus = 'start';
    spawnFood();
    updateScore();
  }

  function loadHighScore() {
    try {
      const saved = localStorage.getItem('pixelSnakeHighScore');
      return saved ? parseInt(saved, 10) : 0;
    } catch(e) { return 0; }
  }

  function saveHighScore() {
    if (score > highScore) {
      highScore = score;
      highScoreEl.textContent = highScore;
      try { localStorage.setItem('pixelSnakeHighScore', score.toString()); } catch(e) {}
    }
  }

  function spawnFood() {
    let valid = false;
    while (!valid) {
      food = {
        x: Math.floor(Math.random() * COLS),
        y: Math.floor(Math.random() * ROWS)
      };
      valid = !snake.some(s => s.x === food.x && s.y === food.y);
    }
  }

  function updateScore() {
    scoreEl.textContent = score;
  }

  function setDirection(dx, dy) {
    if (gameStatus !== 'playing') return;
    if (dx === -direction.x && dy === -direction.y) return;
    nextDirection = {x: dx, y: dy};
  }

  function update() {
    direction = nextDirection;
    const head = {x: snake[0].x + direction.x, y: snake[0].y + direction.y};

    if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
      gameOver();
      return;
    }

    if (snake.some(s => s.x === head.x && s.y === head.y)) {
      gameOver();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score++;
      updateScore();
      spawnParticles(food.x, food.y, COLORS.food, 24, {
        speedMul: 1.3,
        sizeMul: 1.2,
        secondColor: '#ffd93d'
      });
      spawnShockwave(food.x, food.y, COLORS.food);
      spawnFood();
      playEat();
    } else {
      snake.pop();
    }
  }

  function draw() {
    ctx.fillStyle = COLORS.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = COLORS.grid;
    ctx.lineWidth = 1;
    for (let i = 0; i <= COLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * GRID + 0.5, 0);
      ctx.lineTo(i * GRID + 0.5, canvas.height);
      ctx.stroke();
    }
    for (let i = 0; i <= ROWS; i++) {
      ctx.beginPath();
      ctx.moveTo(0, i * GRID + 0.5);
      ctx.lineTo(canvas.width, i * GRID + 0.5);
      ctx.stroke();
    }

    const fx = food.x * GRID;
    const fy = food.y * GRID;
    ctx.fillStyle = COLORS.food;
    ctx.fillRect(fx + 3, fy + 4, GRID - 6, GRID - 6);
    ctx.fillRect(fx + 2, fy + 5, GRID - 4, GRID - 8);
    ctx.fillStyle = COLORS.foodLeaf;
    ctx.fillRect(fx + GRID / 2 - 1, fy + 1, 2, 3);
    ctx.fillRect(fx + GRID / 2 + 1, fy + 2, 2, 2);

    snake.forEach((seg, i) => {
      const x = seg.x * GRID;
      const y = seg.y * GRID;
      ctx.fillStyle = i === 0 ? COLORS.snakeHead : COLORS.snakeBody;
      ctx.fillRect(x + 1, y + 1, GRID - 2, GRID - 2);

      if (i === 0) {
        ctx.fillStyle = COLORS.snakeEye;
        const eyeSize = 3;
        let ex1, ey1, ex2, ey2;
        if (direction.x === 1) {
          ex1 = x + GRID - 6; ey1 = y + 4;
          ex2 = x + GRID - 6; ey2 = y + GRID - 7;
        } else if (direction.x === -1) {
          ex1 = x + 3; ey1 = y + 4;
          ex2 = x + 3; ey2 = y + GRID - 7;
        } else if (direction.y === -1) {
          ex1 = x + 4; ey1 = y + 3;
          ex2 = x + GRID - 7; ey2 = y + 3;
        } else {
          ex1 = x + 4; ey1 = y + GRID - 6;
          ex2 = x + GRID - 7; ey2 = y + GRID - 6;
        }
        ctx.fillRect(ex1, ey1, eyeSize, eyeSize);
        ctx.fillRect(ex2, ey2, eyeSize, eyeSize);
      }
    });

    drawParticles();
  }

  function gameLoop(timestamp) {
    if (!lastTime) lastTime = timestamp;
    const delta = timestamp - lastTime;
    lastTime = timestamp;

    if (gameStatus === 'playing') {
      accumulator += delta;
      while (accumulator >= speed) {
        update();
        accumulator -= speed;
        if (gameStatus !== 'playing') break;
      }
    }

    updateParticles();
    draw();
    requestAnimationFrame(gameLoop);
  }

  function startGame() {
    initAudio();
    resetGame();
    gameStatus = 'playing';
    accumulator = 0;
    lastTime = 0;
    overlay.classList.add('hidden');
    playStart();
  }

  function pauseGame() {
    if (gameStatus !== 'playing') return;
    gameStatus = 'paused';
    showOverlay('PAUSED', '按 P 继续', '');
  }

  function resumeGame() {
    if (gameStatus !== 'paused') return;
    gameStatus = 'playing';
    accumulator = 0;
    lastTime = 0;
    overlay.classList.add('hidden');
  }

  function gameOver() {
    gameStatus = 'gameover';
    saveHighScore();
    playGameOver();
    // 蛇身碎裂粒子效果
    snake.forEach((seg, i) => {
      setTimeout(() => {
        spawnParticles(seg.x, seg.y, i === 0 ? COLORS.snakeHead : COLORS.snakeBody, 10, {
          speedMul: 1.5,
          sizeMul: 1.3,
          secondColor: '#ffd93d'
        });
        spawnShockwave(seg.x, seg.y, i === 0 ? COLORS.snakeHead : COLORS.snakeBody);
      }, i * 25);
    });
    const isNewRecord = score === highScore && score > 0;
    showOverlay(
      'GAME OVER',
      '得分: ' + score,
      isNewRecord ? 'NEW HIGH SCORE!' : ''
    );
  }

  function showOverlay(title, scoreText, highlight) {
    overlay.classList.remove('hidden');
    overlay.innerHTML = `
      <div class="overlay-title">${title}</div>
      <div class="overlay-score">${scoreText}</div>
      ${highlight ? `<div class="overlay-highlight">${highlight}</div>` : ''}
      <div class="overlay-hint">
        按 空格 重新开始<br>
        或 点击屏幕
      </div>
      <button class="pixel-btn" id="restartBtn">RESTART</button>
    `;
    document.getElementById('restartBtn').addEventListener('click', (e) => {
      startGame();
      e.target.blur();
    });
  }

  function bindEvents() {
    document.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();

      if (key === 'arrowup' || key === 'w') { setDirection(0, -1); e.preventDefault(); }
      else if (key === 'arrowdown' || key === 's') { setDirection(0, 1); e.preventDefault(); }
      else if (key === 'arrowleft' || key === 'a') { setDirection(-1, 0); e.preventDefault(); }
      else if (key === 'arrowright' || key === 'd') { setDirection(1, 0); e.preventDefault(); }
      else if (key === ' ' || key === 'enter') {
        e.preventDefault();
        if (gameStatus === 'start' || gameStatus === 'gameover') startGame();
      }
      else if (key === 'p' || key === 'escape') {
        e.preventDefault();
        if (gameStatus === 'playing') pauseGame();
        else if (gameStatus === 'paused') resumeGame();
      }
    });

    startBtn.addEventListener('click', (e) => {
      startGame();
      e.target.blur();
    });

    document.getElementById('soundBtn').addEventListener('click', (e) => {
      initAudio();
      toggleSound();
      e.target.blur();
    });

    canvas.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      e.preventDefault();
    }, { passive: false });

    canvas.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;

      if (Math.abs(dx) < SWIPE_THRESHOLD && Math.abs(dy) < SWIPE_THRESHOLD) {
        if (gameStatus === 'start' || gameStatus === 'gameover') startGame();
        e.preventDefault();
        return;
      }

      if (Math.abs(dx) > Math.abs(dy)) {
        if (dx > 0) setDirection(1, 0);
        else setDirection(-1, 0);
      } else {
        if (dy > 0) setDirection(0, 1);
        else setDirection(0, -1);
      }
      e.preventDefault();
    }, { passive: false });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden && gameStatus === 'playing') pauseGame();
    });
  }

  init();
})();
</script>

</body>
