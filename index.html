<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ff6b9d" />
    <meta name="description" content="糖果像素风贪吃蛇：吃水果、积累连击，挑战自己的最高分。" />
    <title>Candy Snake - 糖果贪吃蛇</title>
  </head>
  <body>
    <main class="game-container" id="gameRoot" aria-label="糖果贪吃蛇">
      <h1 class="game-title">🍬 CANDY SNAKE 🍭</h1>
      <div class="score-board">
        <div class="score-box">SCORE<br /><span id="score">0</span></div>
        <div class="score-box">COMBO<br /><span id="combo">x0</span></div>
        <div class="score-box">BEST<br /><span id="highScore">0</span></div>
        <div class="toolbar">
          <button
            class="sound-btn"
            id="pauseBtn"
            data-action="toggle-pause"
            type="button"
            aria-label="暂停游戏"
            title="暂停游戏"
            disabled
          >
            Ⅱ
          </button>
          <button
            class="sound-btn"
            id="soundBtn"
            data-action="toggle-sound"
            type="button"
            aria-label="关闭音效"
            title="关闭音效"
            aria-pressed="true"
          >
            🔊
          </button>
        </div>
      </div>
      <div class="canvas-wrap" id="canvasWrap">
        <canvas
          id="gameCanvas"
          width="400"
          height="400"
          data-action="primary"
          tabindex="0"
          aria-label="游戏棋盘，使用方向键或 WASD 移动，也可以在触屏上滑动。"
          >请使用支持 Canvas 的浏览器游玩。</canvas
        >
        <div class="combo-display" id="comboDisplay" aria-hidden="true"></div>
      </div>
      <p class="controls-hint" id="controlsHint">
        方向键 / WASD / 触屏滑动<br />空格 开始 / 重开 &nbsp;|&nbsp; P / Esc 暂停
      </p>
      <section id="overlay" class="overlay" data-action="primary" aria-labelledby="overlayTitle">
        <div class="candy-logo" aria-hidden="true">
          <span class="s">S</span><span class="n">N</span><span class="a">A</span
          ><span class="k">K</span><span class="e">E</span>
        </div>
        <h2 class="overlay-title" id="overlayTitle">CANDY SNAKE</h2>
        <p class="overlay-score" id="overlayScore">最高分: 0</p>
        <p class="overlay-highlight" id="overlayHighlight" hidden></p>
        <p class="overlay-hint" id="overlayHint">吃水果累积连击<br />每 10 连击有惊喜哦 ✨</p>
        <button class="pixel-btn" id="primaryBtn" data-action="primary" type="button">
          开始游戏
        </button>
      </section>
    </main>
